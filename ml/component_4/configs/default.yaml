# Component 4 default configuration. Every assumption here is explained in docs/assumptions.md.
seed: 42

area:
  name: Horton Plains National Park
  bbox: [80.740, 6.770, 80.840, 6.850]      # left, bottom, right, top (WGS84) for OSM: all three trails
  dem_bbox: [80.730, 6.755, 80.850, 6.860]  # larger, so TWI catchments are not cut off
  weather_point: [6.795, 80.800]            # lat, lon (Open-Meteo snaps to its grid)
  crs_metric: "EPSG:32644"                  # UTM 44N, metres
  pois:                                     # OSM names
    entrance: "Horton Plains Visitor Center"
    mini_worlds_end: "Mini World's End"
    worlds_end: "World's End (Plate 1)"
    bakers_falls: "Baker's Falls"
    kirigalpotta_peak: "Kirigalpotta"
    thotupola_head: "Thotupola Trailhead"
    thotupola_peak: "Thotupola Kanda"
  routes:                                   # walked in this order (shortest path between the POIs)
    main: [entrance, mini_worlds_end, worlds_end, bakers_falls, entrance]
    kirigalpotta: [entrance, kirigalpotta_peak, entrance]
    thotupola: [thotupola_head, thotupola_peak, thotupola_head]
  road_links:                               # not walkable; joined in the graph with a weaker edge
    - [entrance, thotupola_head, 0.5]       # 4.2 km drive on the Pattipola road
  trail_names:
    main: "World's End loop"
    kirigalpotta: "Kirigalpotta"
    thotupola: "Thotupola Kanda"
  trail_info:                               # one line per trail for visitors
    main: "Loop past Mini World's End, World's End and Baker's Falls; about 3.5 hours"
    kirigalpotta: "5.2 km each way to the 2nd-highest peak (2,388 m); long and exposed, last start 09:30"
    thotupola: "1.3 km each way to the 3rd-highest peak (2,357 m); trailhead is a 4.2 km drive up the Pattipola road"
  main_trail: main                          # the busiest trail (suggestions move people away from it)
  focus_poi: worlds_end                     # the place whose crowding matters most
  poi_roles:
    viewpoint: [mini_worlds_end, worlds_end, bakers_falls, kirigalpotta_peak, thotupola_peak]
    access: [entrance, thotupola_head]
  poi_labels:
    entrance: "Visitor Center"
    mini_worlds_end: "Mini World's End"
    worlds_end: "World's End"
    bakers_falls: "Baker's Falls"
    kirigalpotta_peak: "Kirigalpotta peak"
    thotupola_head: "Thotupola trailhead"
    thotupola_peak: "Thotupola Kanda"

graph:
  target_segment_m: 300   # densify the loop into ~300 m segments (graph nodes)
  poi_snap_m: 80          # a POI tags the segment it lies within this distance of
  max_grade: 0.25         # cap on DEM grades (DEM cells beside cliffs exaggerate the slope)

dates:
  start: "2022-01-01"
  end: "2025-12-31"
  train_end: "2023-12-31"
  val_end: "2024-12-31"   # test = 2025

simulator:
  base_daily_visitors: 450          # ordinary weekday, average season
  dow_multiplier: [1.0, 0.9, 0.9, 0.95, 1.1, 1.9, 2.1]   # Mon..Sun
  holiday_multiplier: 1.9
  poya_multiplier: 2.4
  long_weekend_multiplier: 1.3
  school_holiday_multiplier: 1.25
  month_multiplier: [1.1, 1.1, 1.0, 1.4, 0.9, 0.8, 0.85, 1.0, 0.8, 0.8, 0.85, 1.2]
  daily_noise_sd: 0.15              # lognormal day-to-day variation
  morning_rain_k: 0.06              # demand x exp(-k * rain mm between 05:00 and 10:00)
  min_rain_multiplier: 0.35
  group_size_poisson_mean: 2.2      # group size = 1 + Poisson(mean)
  arrival_early_share: 0.85
  arrival_early_mean_h: 6.9
  arrival_early_sd_h: 0.75
  arrival_late_range_h: [8.5, 12.5]
  gate_open_h: 6.0
  gate_last_entry_h: 13.0
  route_share:                      # which trail a group hikes (whole-park demand is split)
    main: 0.86
    kirigalpotta: 0.05
    thotupola: 0.09
  route_last_entry_h:               # later starts are not allowed (too long to finish before closing)
    kirigalpotta: 9.5
  route_start_offset_min:           # extra time before the walk starts
    thotupola: 12                   # drive 4.2 km back down the Pattipola road and park
  reversible_routes: [main]         # loops that can be walked either way
  standard_direction_share: 0.85    # main loop: Mini World's End -> World's End -> Baker's Falls first
  walker_speed_sd: 0.12             # lognormal spread of group walking speed
  leisure_speed_factor: 0.75        # tourists walk slower than Tobler's fit-hiker speed (photos, rests)
  rain_light_mm: 0.5
  rain_heavy_mm: 3.0
  rain_light_speed: 0.85
  rain_heavy_speed: 0.70
  crowd_rho0_per_m: 0.4             # density (persons/m) at which speed halves
  crowd_min_speed: 0.4              # crowding never slows walkers below 40% of free speed
  dwell_minutes:                    # lognormal median, sd of log
    mini_worlds_end: [8, 0.4]
    worlds_end: [20, 0.4]
    bakers_falls: [12, 0.4]
    kirigalpotta_peak: [20, 0.4]
    thotupola_peak: [15, 0.4]
  obs_noise_sd: 0.10

task:
  input_steps: 24
  horizon: 24
  open_hours: [6, 18]     # score targets with 06:00 <= hour <= 18:00 only
  spatial_blocks: 4

train:
  hidden: 32
  batch_size: 64
  lr: 0.002
  epochs: 20
  patience: 4
  train_origin_stride: 4  # use every 4th hour as a training origin (windows overlap heavily anyway)
  seeds: [42, 43, 44]
  spatial_seeds: [42]
  peak_hours: [7, 11]     # morning peak used for MAE_peak

planning:
  typical_start_h: 7      # when most visitors start (baseline for the 'start later' suggestion)
  later_note: "Views at World's End are often lost to mist later in the morning."
  access_note: "Check with DWC that the trail is open and whether a guide is needed."

capacity:                 # Cifuentes (1992) PCC -> RCC -> ECC, per segment
  space_per_person_m: 1.0 # 1 m of trail per hiker (Cifuentes standard for trails)
  group_size: 10          # maximum group size used for the social factor
  group_gap_m: 50         # minimum distance between groups
  open_from_h: 6          # first open hour
  open_hours: 12          # 06:00-18:00
  rain_mm: 0.5            # an open hour with >= this forecast rain counts as a rainy hour
  management_capacity: 0.7  # MC: share of required staff/infrastructure available (assumption)
  busy_utilisation: 0.8   # forecast peak / effective capacity above this = "busy"

control:                  # entry control: timed tickets per trail and slot (upgrade_plan.md, section 2)
  slot_minutes: 30
  first_slot_h: 6.0       # gate opens
  last_slot_h: 12.5       # last slot starts 12:30 (last entry 13:00)
  bin_minutes: 30         # occupancy is checked every 30 minutes
  viewpoint_min_at_once: 50   # placeholder: viewpoints are platforms, not 1-m-wide trail; measure on a field visit
  exempt_access_points: true  # Visitor Center / trailhead are facilities, not trail
  use_daily_quota: true   # also respect the Cifuentes daily quota per trail
  safety_margin: 0.9      # plan to 90 % of capacity (crowd slowdown is not in the linear model)
  capacity_scale: 1.0     # multiplies segment capacity; DWC's choice of standard (see the trade-off sweep)
  walk_in_share: 0.2      # share of every slot kept for visitors without a booking
  slot_window_min: 15     # a ticket is valid from 15 min before to 15 min after its slot start
  response_walkers: 300   # simulated walkers per slot used to measure where a ticket-holder will be
  max_slot_shift_h: 2     # evaluation: visitors accept a slot up to 2 h later
  accept_trail_swap: 0.3  # evaluation: share who accept another trail when their trail is full
  booking_horizon_days: 90

live:                     # live mode: real dates, refreshed every evening (live_and_ux_plan.md, section 2)
  horizon_days: 90        # outlook and bookings
  forecast_days: 16       # Open-Meteo forecast horizon; climatology after this
  calendar_extra_days: 120
  dwc_totals_csv: data/live/dwc_daily_totals.csv   # optional: date,trail,visitors (real counts replace simulated)

api:
  allow_time_override: true   # DEMO ONLY: staff may pass a time ('at') for check-in / walk-ins / live status
  cors_origins: ["*"]         # development; restrict to the app's origin in production

arima:
  order: [1, 0, 1]
  seasonal_order: [1, 1, 1, 24]
  fit_days: 60
  history_days: 14
