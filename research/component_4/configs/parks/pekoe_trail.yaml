planning:
  typical_start_h: 7.0
  later_note: "Start early: most stages take 5-7 hours and afternoon rain is common."
  access_note: "No tickets: walk any stage. Check the weather for your stage before setting off."

control:
  first_slot_h: 6.0
  last_slot_h: 11.0
  viewpoint_min_at_once: 40          # (A) Lipton's Seat / Little Adam's Peak hold more than a path
  hotspot_at_once: 30                # (A) stage advice: a section with a viewpoint is full at 30 people there at once
  booking_mode: required             # (kept for the slot tables the refresh writes; no stage is ticketed)
  default_mode: open_stages          # P4: stage advice, no tickets (src/control/modes.py)
