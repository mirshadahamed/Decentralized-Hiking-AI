# The Pekoe Trail (long-distance trail, 22 stages, ~323 km). Overrides configs/default.yaml.
# Use with:  $env:C4_PARK = "pekoe_trail"
# Every number marked (A) is an assumption: no visitor counts exist for the trail (the research gap's
# "no historical sensor record" case). To calibrate with the trail organisation's figures and field counts
# (docs/assumptions_pekoe_trail.md).

destination:
  kind: long_distance_trail
  region: "Central and Uva Provinces · Kandy, Nuwara Eliya and Badulla Districts"
  summary: "A 300 km walking trail through the tea country in 22 stages, on old estate roads and paths from Kandy past Horton Plains, Haputale and Ella to Nuwara Eliya."
  elevation: "about 600 m – 2,100 m"
  best_time: "January to April is driest across the hill country. The western stages get the south-west monsoon (May–September), the eastern stages around Ella the north-east monsoon (November–January)."
  getting_there: "Stage starts are tea-estate villages and towns reached by road; the hill-country railway stops near many of them (e.g. Nanu Oya, Pattipola, Haputale, Ella)."
  facts:
    - "Each stage is 9–21 km, about 4–8 hours of walking"
    - "Open access: no tickets and no gate; walkers start at any stage"
    - "The stages around Ella and Haputale share paths with day visitors"
    - "Walk in daylight and leave early: afternoon rain is common"
  accent: "#2E7D32"

