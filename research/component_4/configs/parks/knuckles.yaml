# Knuckles Range (Knuckles Conservation Forest). Overrides configs/default.yaml.
# Use with:  $env:C4_PARK = "knuckles"
# Plan: docs/knuckles_and_next_steps_plan.md (section 4). Assumptions: docs/assumptions_knuckles.md.
# Every number marked (A) is an assumption until the Forest Department's rules and visitor records and our field
# counts are in. Waypoints are OSM features (ids in the assumptions doc); legs OSM cannot route are straight
# lines marked approximate (data/processed/graph_quality.json) until GPS tracks are recorded.
# One area, several crowd-control mechanisms (src/control/modes.py):
#   guided_permit  long treks with a guide (daily cap from capacity and guides on duty; out-and-back check)
#   gate_slots     short nature trails ticketed at the conservation centres
#   open_viewpoint roadside viewpoints and falls anyone can drive to (busy hours, parking)

destination:
  kind: forest_reserve
  region: "Central Province · Kandy and Matale Districts"
  summary: "Cloud forest, peaks and waterfalls in the Knuckles Range, part of the Central Highlands World Heritage Site: short nature trails, roadside viewpoints and guided treks from Riverston, Deanston, Kalupahana and Meemure."
  elevation: "about 500 m – 1,900 m"
  best_time: "January to April and July to September are the driest months; mist and rain can come in any afternoon."
  getting_there: "Riverston and Pitawala Pathana from Matale via Rattota; Deanston and Corbet's Gap from Kandy via Hunnasgiriya and Rangala; Meemure is a long drive past Corbet's Gap."
  facts:
    - "Several entry areas, far apart by road"
    - "Long treks need a permit and a registered guide"
    - "Pitawala Pathana and Sera Ella are open to everyone and crowded at weekends"
    - "Leeches, mist and river crossings: start early and be out before the afternoon rain"
  accent: "#1B5E20"

area:
  name: "Knuckles Range"
  bbox: [80.65, 7.30, 80.95, 7.62]
  dem_bbox: [80.65, 7.30, 80.95, 7.62]
  weather_point: [7.45, 80.80]
  crs_metric: "EPSG:32644"
  pois: {__replace__: true}
  routes: {__replace__: true}
  road_links: []
  poi_points:                                # lon, lat (OSM node in docs/assumptions_knuckles.md; (A) = placed by hand)
    pitawala_park: [80.7532, 7.5477]         # Pitawala Pathana Car Park
    pitawala_vp: [80.7480, 7.5440]           # (A) the plateau edge, ~700 m from the car park
    sera_head: [80.7600, 7.5850]             # (A) roadside start of the Sera Ella footpath
    sera_ella: [80.7552, 7.5883]             # Sera Ella Water Fall
    nature_camp: [80.7472, 7.5244]           # Knuckles Nature Camp (Riverston side)
    manigala_camp: [80.7671, 7.5202]         # Manigala Camp Site
    maningala: [80.7747, 7.5242]             # Maningala peak
    riverston: [80.7339, 7.5245]             # Riverston viewpoint
    kirigalpotta_k: [80.7300, 7.4767]        # Knuckles-Kirigalpotta peak
    gombaniya: [80.7483, 7.4551]             # Gombaniya, highest peak of the range
    deanston: [80.7874, 7.3946]              # (A) Deanston trailhead (Venture Camps area)
    knuckles_falls: [80.7974, 7.4031]        # Knuckles Waterfall
    knuckles_peak: [80.8107, 7.4002]         # Knuckles peak (five peaks ridge)
    dothalugala_head: [80.8674, 7.3357]      # Mini World's End viewpoint (Dothalugala side)
    dothalugala: [80.8482, 7.3334]           # Dothalugala peak
    kalupahana: [80.8084, 7.4416]            # Kalupahana viewpoint
    duwili_ella: [80.8009, 7.4618]           # Duwili Ella
    meemure: [80.8442, 7.4414]               # Meemure village
    lakegala: [80.8394, 7.4661]              # Lakegala peak
  waypoint_trails:
    pitawala: {points: [pitawala_park, pitawala_vp]}
    sera_ella: {points: [sera_head, sera_ella]}
    maningala: {points: [nature_camp, manigala_camp, maningala]}
    gombaniya: {points: [riverston, kirigalpotta_k, gombaniya]}
    knuckles_falls: {points: [deanston, knuckles_falls]}
    five_peaks: {points: [deanston, knuckles_peak]}
    dothalugala: {points: [dothalugala_head, dothalugala]}
    duwili_ella: {points: [kalupahana, duwili_ella]}
    lakegala: {points: [meemure, lakegala]}
  trail_entries:                             # trails starting from the same place share a graph edge
    pitawala: riverston
    maningala: riverston
    gombaniya: riverston
    sera_ella: laggala
    knuckles_falls: deanston
    five_peaks: deanston
    dothalugala: rangala
    duwili_ella: kalupahana
    lakegala: meemure
  trail_names:
    __replace__: true
    pitawala: "Pitawala Pathana"
    sera_ella: "Sera Ella"
    maningala: "Maningala trek"
    gombaniya: "Gombaniya (Knuckles peak) trek"
    knuckles_falls: "Knuckles Waterfall trail"
    five_peaks: "Knuckles five peaks trek"
    dothalugala: "Dothalugala nature trail"
    duwili_ella: "Duwili Ella trek"
    lakegala: "Lakegala trek"
  trail_info:
    __replace__: true
    pitawala: "Open grassland and cliff edge 700 m from the car park; very busy on weekend mornings"
    sera_ella: "Short walk to the falls and pool; open to everyone"
    maningala: "Guided trek via Manigala camp to Maningala peak; about 5 hours"
    gombaniya: "Guided full-day trek over Kirigalpotta to the range's highest peak; about 8 hours"
    knuckles_falls: "Nature trail from Deanston to the Knuckles waterfall; ticket at the centre"
    five_peaks: "Guided trek from Deanston to the Knuckles peak ridge; about 6.5 hours"
    dothalugala: "Marked nature trail from Mini World's End to Dothalugala; ticket at the centre"
    duwili_ella: "Guided trek from Kalupahana to Duwili Ella, with river crossings; about 5 hours"
    lakegala: "Guided climb from Meemure village to Lakegala; about 4 hours"
  trail_modes:
    pitawala: open_viewpoint
    sera_ella: open_viewpoint
    knuckles_falls: gate_slots
    dothalugala: gate_slots
  main_trail: pitawala
  focus_poi: pitawala_vp
  poi_roles:
    __replace__: true
    viewpoint: [pitawala_vp, sera_ella, maningala, gombaniya, knuckles_falls, knuckles_peak, dothalugala, duwili_ella, lakegala]
    access: [head_pitawala, head_sera_ella, head_maningala, head_gombaniya, head_knuckles_falls, head_five_peaks,
             head_dothalugala, head_duwili_ella, head_lakegala]
  poi_labels:
    __replace__: true
    pitawala_vp: "Pitawala Pathana edge"
    sera_ella: "Sera Ella falls"
    manigala_camp: "Manigala camp"
    maningala: "Maningala peak"
    kirigalpotta_k: "Knuckles-Kirigalpotta"
    gombaniya: "Gombaniya peak"
    knuckles_falls: "Knuckles waterfall"
    knuckles_peak: "Knuckles peak"
    dothalugala: "Dothalugala"
    duwili_ella: "Duwili Ella"
    lakegala: "Lakegala"

graph:
  target_segment_m: 800      # 9 trails of 1-12 km: ~70 sections
  osm_filter: '["highway"~"path|footway|track|steps|unclassified|residential|service|tertiary|secondary|primary|living_street|bridleway"]'   # with main roads: trailheads are on them
  snap_max_m: 1000           # a waypoint farther than this from the OSM walk network: straight leg (nearer: a straight connector)
  max_detour: 3.0            # an OSM route longer than this x the straight line is a road detour: straight leg
  straight_factor: 1.3       # (A) a mountain path is ~30 % longer than the straight line between its ends
  share_m: 150
  max_grade: 0.40

simulator:
  base_daily_visitors: 260           # (A) all trails, ordinary weekday in season
  dow_multiplier: [0.8, 0.7, 0.7, 0.75, 0.9, 2.4, 2.2]   # (A) weekend day-trippers from Kandy / Matale
  holiday_multiplier: 2.0
  poya_multiplier: 1.9
  long_weekend_multiplier: 1.6
  school_holiday_multiplier: 1.3
  month_multiplier: [1.2, 1.3, 1.3, 1.4, 0.8, 0.7, 1.0, 1.1, 0.9, 0.7, 0.6, 1.0]   # (A) two monsoons
  daily_noise_sd: 0.2
  morning_rain_k: 0.08
  group_size_poisson_mean: 3.0       # (A) families and van groups; guided groups larger
  arrival_early_share: 0.75
  arrival_early_mean_h: 7.5
  arrival_early_sd_h: 1.0
  arrival_late_range_h: [9.0, 13.0]
  gate_open_h: 6.0
  gate_last_entry_h: 14.0
  route_share:                       # (A) day-trippers mostly at the open viewpoints
    __replace__: true
    pitawala: 0.30
    sera_ella: 0.12
    maningala: 0.08
    gombaniya: 0.04
    knuckles_falls: 0.08
    five_peaks: 0.10
    dothalugala: 0.08
    duwili_ella: 0.10
    lakegala: 0.10
  route_last_entry_h:                # (A) long treks must start early
    __replace__: true
    maningala: 9.0
    gombaniya: 7.5
    five_peaks: 8.5
    duwili_ella: 9.0
    lakegala: 10.0
  route_start_offset_min: {__replace__: true}
  reversible_routes: []
  dwell_minutes:
    __replace__: true
    pitawala_vp: [35, 0.5]           # (A) photos, picnic at the edge
    sera_ella: [40, 0.5]             # (A) bathing in the pool
    maningala: [20, 0.4]
    gombaniya: [25, 0.4]
    knuckles_falls: [25, 0.4]
    knuckles_peak: [20, 0.4]
    dothalugala: [15, 0.4]
    duwili_ella: [40, 0.5]
    lakegala: [20, 0.4]
  guided_groups:                     # (A) K3: treks go as guided groups that leave the entry together
    trails: [maningala, gombaniya, five_peaks, duwili_ella, lakegala]
    size: [4, 12]                    # same limit as control.permits.max_group
    start_h: 7.0
    start_sd_h: 0.5
  rain_closures:                     # (A) K3: river crossings closed when the 06-12 rain reaches this (mm)
    duwili_ella: 15
    lakegala: 25
  realism:
    burst_people: [20, 60]           # (A) a van group or school trip at Pitawala Pathana
    burst_window_h: [8.0, 11.0]

task:
  open_hours: [6, 18]

capacity:
  space_per_person_m: 2.0            # (A)
  group_size: 6                      # (A)
  group_gap_m: 60                    # (A)
  open_from_h: 6
  open_hours: 12
  main_trail: pitawala

planning:
  typical_start_h: 7.5
  later_note: "Start early: mist and rain often come after midday."
  access_note: "Long treks need a permit and a guide; Pitawala Pathana and Sera Ella are open to everyone."

control:
  first_slot_h: 6.0
  last_slot_h: 12.0
  viewpoint_min_at_once: 40          # (A) the Pitawala edge and the Sera Ella pool hold more than a path
  booking_mode: required             # the gate_slots nature trails sell slot tickets
  default_mode: guided_permit
  permits:                           # K4 / K5 (src/control/permits.py)
    max_group: 12                    # (A) one guide per group of up to 12
    mean_group: 6                    # (A)
    guides_on_duty:                  # (A) registered guides on an ordinary day, per entry area
      riverston: 6
      deanston: 6
      kalupahana: 4
      meemure: 5
    treks:                           # entry area and walking time (A) per trek
      maningala: {entry: riverston, walk_h: 5.0}
      gombaniya: {entry: riverston, walk_h: 8.0}
      five_peaks: {entry: deanston, walk_h: 6.5}
      duwili_ella: {entry: kalupahana, walk_h: 5.0}
      lakegala: {entry: meemure, walk_h: 4.0}
    big_group_slowdown: 0.02         # (A) +2 % walking time per person above 4
    rain_slowdown: 0.25              # (A) +25 % on a fully rainy day
    overdue_margin_min: 45           # (A) never alarm sooner than this late
    overdue_cv: 0.15                 # (A) spread of trek times (coefficient of variation)
    overdue_z: 2.3                   # alarm at z x spread late: ~1 % false alarms
    rain_margin_cut_min: 30          # (A) ... up to 30 min sooner on a rainy day (rivers, mist)
  viewpoints:                        # K6 (src/serve/viewpoints.py): parking at the open viewpoints
    pitawala: {parking_spaces: 60, people_per_vehicle: 4.0}     # (A)
    sera_ella: {parking_spaces: 20, people_per_vehicle: 4.0}    # (A)
  campsites:                         # K7: pitches per night (A); names from OSM
    nature_camp: {name: "Knuckles Nature Camp", pitches: 15, trail: maningala}
    manigala_camp: {name: "Manigala Camp Site", pitches: 10, trail: maningala}
    duwili_cave: {name: "Duwili Ella Cave Campsite", pitches: 6, trail: duwili_ella}
    meemure_addara: {name: "Meemure Ganga Addara Campsite", pitches: 12, trail: lakegala}
